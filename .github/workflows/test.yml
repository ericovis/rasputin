# CI for rasputin.
#
# This runs everything that does NOT need a Raspberry Pi: the unit tests, go
# vet, a gofmt check, the linux/arm64 CGO_ENABLED=0 cross-build and `make
# build` (which compiles the CLI, renders the man page and assembles
# out/recovery.gz by cross-compiling ./cmd/agent — no downloads, no hardware).
#
# Deliberately NOT run here, for two different reasons:
#
#   * Every command that reaches a node — sync, adopt, dryrun, bake, flash,
#     status, serve. They need the four Pis on the LAN, SSH to them and the
#     owner's passphrase-protected key, and flash, bake and sync wipe a node's
#     card. None of that exists on a runner, so hardware stays a manual step.
#   * A full `prepare`, which touches only out/ and cache/ and never a node,
#     but downloads the ~500 MB stock image and needs ~3 GB free. CI runs only
#     `prepare -initramfs-only`, via `make build`.
#
# That second exclusion costs coverage: internal/prepare's TestImageContents —
# the no-hardware end-to-end image gate — skips itself when
# out/vanilla-custom.img is absent, and on a fresh checkout it always is. A
# broken boot partition is caught only by `go run ./cmd/rasputin prepare` then
# `go test ./internal/prepare`, never by a green run here. The three
# identity-script tests in internal/provision run only on darwin, so they are
# covered by `make test` on the owner's Mac, not here.

name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PRs: cancelling a push run would leave a commit on main that was
  # neither passed nor failed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Linux only: the suite is also required to pass on the owner's Mac, but
    # that is checked by `make test` there, and one runner is enough here.
    runs-on: ubuntu-latest
    # Everything here takes a couple of minutes; the cap is so a wedged
    # toolchain or a hung module fetch in `make build` cannot burn the
    # 6-hour default.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # go test ./... plus GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./...
      - name: make test
        run: make test

      # CLI + out/rasputin.1 + out/recovery.gz (the agent, cross-compiled).
      - name: make build
        run: make build
