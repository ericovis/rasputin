# rasputin cluster — single source of truth, sourced by all scripts (POSIX sh).

# User baked into the base image (SSH key from config/authorized_keys,
# passwordless sudo; password auth disabled; no default `pi` user).
NODE_USER=berry

# Locale / timezone
TIMEZONE=America/Sao_Paulo
LOCALE=en_US.UTF-8

# Packages installed into the base image
EXTRA_PACKAGES="podman curl htop vim git tmux"

# Name of the published compressed base image
IMAGE_FILE=pi3-base.img.zst

# Port reflash.sh uses for its ephemeral HTTP server
HTTP_PORT=8080

# Fallback image URL baked into the recovery initramfs. Only used when the
# reflash flag file is EMPTY (e.g. manual `touch /boot/firmware/reflash`);
# reflash.sh normally writes the actual ephemeral-server URL into the flag.
DEFAULT_IMAGE_URL="http://192.168.0.228:8080/pi3-base.img.zst"
