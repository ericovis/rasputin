# A four-node cluster of the shape the tests expect. Nothing here is real:
# the MACs are made up, and the tests that need a key substitute their own.
cluster: rasputin
server:
  port: 8080
image:
  source_url: https://downloads.raspberrypi.com/raspios_lite_arm64_latest
  rootfs_size_gb: 4
ssh:
  key: ~/.ssh/id_ed25519
  users: [berry]
  sudo: passwordless
provision:
  user: berry
  authorized_keys: ~/.ssh/id_ed25519.pub
  timezone: Etc/UTC
  locale: en_US.UTF-8
  packages: [curl]
builder: rasputin001
timeouts:
  flash_minutes: 25
  bake_minutes: 45
nodes:
  - { name: rasputin001, mac: "b8:27:eb:01:02:03" }
  - { name: rasputin002, mac: "b8:27:eb:04:05:06" }
  - { name: rasputin003, mac: "b8:27:eb:07:08:09" }
  - { name: rasputin004, mac: "b8:27:eb:0a:0b:0c" }
